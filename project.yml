name: coucou
options:
  bundleIdPrefix: com.marswave
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CJSWWQ2B9V
    BIKECUES_HK: YES
    CODE_SIGN_STYLE: Automatic
targets:
  coucou:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    dependencies:
      - target: coucouWidgets
    entitlements:
      path: bikecues.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 咕咕骑车
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 咕咕骑车使用定位获取骑行速度、距离和轨迹，仅用于你的骑行记录。
        INFOPLIST_KEY_NSHealthShareUsageDescription: 咕咕骑车读取心率等健康数据，用于实时显示与语音播报。数据保留在设备和苹果健康中。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 咕咕骑车将骑行记录写入苹果健康，与其他来源平起平坐，数据属于你。
        INFOPLIST_KEY_NSMotionUsageDescription: 咕咕骑车使用运动与健身数据提升骑行速度的计算精度。
        INFOPLIST_KEY_UIBackgroundModes: location audio
        SUPPORTS_MACCATALYST: NO
  coucouWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou.coucouWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 咕咕骑车
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SUPPORTS_MACCATALYST: NO
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: 咕咕骑车
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    info:
      path: Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - location
          - audio
        CFBundleDisplayName: 咕咕骑车
        UILaunchScreen:
          UIColorName: LaunchBackground
        BIKECUES_HEALTHKIT: $(BIKECUES_HK)
