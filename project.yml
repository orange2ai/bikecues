name: coucou
options:
  bundleIdPrefix: com.marswave
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CJSWWQ2B9V
    BIKECUES_HK: YES
    CODE_SIGN_STYLE: Automatic
targets:
  coucou:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    entitlements:
      path: bikecues.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 咕咕骑车
        INFOPLIST_KEY_NSHealthShareUsageDescription: 咕咕骑车读取心率、里程等健康数据，用于实时显示与语音播报。记录由手表原生体能训练完成，数据保留在苹果健康中。
        INFOPLIST_KEY_NSMotionUsageDescription: 咕咕骑车使用运动与健身数据提升播报的计算精度。
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 咕咕骑车
        UILaunchScreen:
          UIColorName: LaunchBackground
        BIKECUES_HEALTHKIT: $(BIKECUES_HK)
