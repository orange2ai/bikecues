name: coucou
options:
  bundleIdPrefix: com.marswave
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CJSWWQ2B9V
    BIKECUES_HK: YES
    CODE_SIGN_STYLE: Automatic
targets:
  coucou:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Assets.xcassets
    dependencies:
      - target: coucouWidgets
    entitlements:
      path: bikecues.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 咕咕骑车
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIDeviceFamily:
          - 1
          - 2
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocationWhenInUseUsageDescription: 咕咕骑车使用定位获取骑行速度、距离和轨迹，仅用于你的骑行记录。
        NSHealthShareUsageDescription: 咕咕骑车读取心率等健康数据，用于实时显示与语音播报。数据保留在设备和苹果健康中。
        NSHealthUpdateUsageDescription: 咕咕骑车将骑行记录写入苹果健康，与其他来源平起平坐，数据属于你。
        NSMotionUsageDescription: 咕咕骑车使用运动与健身数据提升骑行速度的计算精度。
        UIBackgroundModes:
          - location
          - audio
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BIKECUES_HEALTHKIT: $(BIKECUES_HK)
  coucouWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes:
          - "Info.plist"
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.marswave.coucou.coucouWidgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SUPPORTS_MACCATALYST: NO
  coucouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: coucou
schemes:
  coucou:
    build:
      targets:
        coucou: all
        coucouWidgets: all
    test:
      config: Debug
      targets:
        - coucouTests
