<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 纯黑满幅底 -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- 布谷鸟：一个胖椭圆身体 -->
  <g fill="#FF9500">
    <ellipse cx="512" cy="580" rx="345" ry="350"/>
    <!-- 呆毛三撮 -->
    <circle cx="432" cy="205" r="46"/>
    <circle cx="512" cy="168" r="52"/>
    <circle cx="592" cy="205" r="46"/>
  </g>

  <!-- 眼睛：大白圆 + 居中黑瞳（呆滞感） -->
  <circle cx="366" cy="470" r="84" fill="#FFFFFF"/>
  <circle cx="658" cy="470" r="84" fill="#FFFFFF"/>
  <circle cx="372" cy="480" r="36" fill="#000000"/>
  <circle cx="652" cy="480" r="36" fill="#000000"/>

  <!-- 嘴：大张的黑三角（stroke round 让三个角圆润） -->
  <path d="M 422 655 L 602 655 L 512 858 Z"
        fill="#000000" stroke="#000000" stroke-width="48" stroke-linejoin="round"/>
</svg>
