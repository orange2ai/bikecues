<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕咕骑行 · Coucou Bike</title>
<meta name="description" content="骑行时，有一只鸟在你耳机里报数。速度、距离、心率，语音播报，数据写入苹果健康。">
<style>
  :root { --orange: #FF9500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 100vh; padding: 48px 40px;
  }
  header h1 {
    font-size: clamp(56px, 10vw, 96px); font-weight: 800; letter-spacing: 2px;
  }
  header p.sub {
    margin-top: 12px; color: var(--orange); font-weight: 600;
    letter-spacing: 6px; font-size: clamp(14px, 2.4vw, 20px);
  }
  main p.story {
    max-width: 560px; line-height: 1.9; color: #bbb; font-size: 17px;
  }
  main p.story strong { color: #fff; }
  main .cue {
    margin-top: 28px; color: var(--orange); font-size: 15px; letter-spacing: 1px;
  }
  footer { display: flex; gap: 28px; flex-wrap: wrap; align-items: center; }
  footer a {
    color: var(--orange); text-decoration: none; font-size: 15px;
    border: 1px solid rgba(255,149,0,.45); border-radius: 999px; padding: 10px 22px;
  }
  footer a:hover { background: rgba(255,149,0,.12); }
  footer span.note { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>咕咕骑行</h1>
    <p class="sub">COUCOU BIKE</p>
  </header>
  <main>
    <p class="story">
      布谷鸟是最老的提醒器：黑森林的钟每整点报一次时，在中国它的叫声就是<strong>"播谷"</strong>，
      提醒农人下地。这个 App 是它的同物种——骑行时，每公里在你耳机里说一句：
      速度、距离、心率。数据写入苹果健康，无广告，开源，买断。
    </p>
    <p class="cue">"已经骑行 1 公里，最近一公里平均速度 23 公里。"</p>
  </main>
  <footer>
    <a href="https://github.com/orange2ai/coucou-bike">GitHub 开源仓库</a>
    <span class="note">App Store 上架后，下载链接出现在这里 · 永不出现广告</span>
  </footer>
</body>
</html>
